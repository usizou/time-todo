<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time & To-Do</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- タブ切り替え（将来 To-Do もここに増やす） -->
  <nav class="tabs">
    <button class="tab active" data-tab="timer">⏱ タイマー</button>
    <button class="tab" data-tab="todo">✓ To-Do</button>
  </nav>

  <!-- タイマー画面 -->
  <section id="tab-timer" class="tab-panel active">
    <!-- モード切り替え -->
    <div class="mode-switch">
      <button class="mode active" data-mode="countdown">カウントダウン</button>
      <button class="mode" data-mode="pomodoro">ポモドーロ</button>
      <button class="mode" data-mode="target">時刻まで</button>
    </div>

    <!-- 残り時間の表示（4重の同心円リング） -->
    <div class="display">
      <svg class="ring" viewBox="0 0 200 200">
        <!-- 背景トラック -->
        <circle class="ring-track" cx="100" cy="100" r="92" />
        <circle class="ring-track" cx="100" cy="100" r="78" />
        <circle class="ring-track" cx="100" cy="100" r="64" />
        <circle class="ring-track" cx="100" cy="100" r="50" />
        <!-- 進捗リング（外→内: 総/時/分/秒） -->
        <circle id="ring-total" class="ring-progress p-total" cx="100" cy="100" r="92" />
        <circle id="ring-hour"  class="ring-progress p-hour"  cx="100" cy="100" r="78" />
        <circle id="ring-min"   class="ring-progress p-min"   cx="100" cy="100" r="64" />
        <circle id="ring-sec"   class="ring-progress p-sec"   cx="100" cy="100" r="50" />
      </svg>
      <div class="ring-center">
        <div id="phase-label" class="phase-label"></div>
        <div id="time" class="time">00:00</div>
        <div id="pomo-count" class="pomo-count"></div>
      </div>
    </div>

    <!-- リングの凡例 -->
    <div class="ring-legend">
      <span class="lg lg-total">総</span>
      <span class="lg lg-hour">時</span>
      <span class="lg lg-min">分</span>
      <span class="lg lg-sec">秒</span>
    </div>

    <!-- カウントダウン用：時間のプリセット＆入力 -->
    <div id="countdown-setup" class="setup">
      <div class="presets">
        <button class="preset" data-sec="60">1分</button>
        <button class="preset" data-sec="300">5分</button>
        <button class="preset" data-sec="600">10分</button>
        <button class="preset" data-sec="1500">25分</button>
        <button class="preset" data-sec="3600">1時間</button>
        <button class="preset" data-sec="10800">3時間</button>
      </div>
      <div class="custom-input">
        <input id="in-hour" type="number" min="0" max="12" value="0" /> 時
        <input id="in-min" type="number" min="0" max="59" value="5" /> 分
        <input id="in-sec" type="number" min="0" max="59" value="0" /> 秒
        <button id="set-btn">セット</button>
      </div>
      <div class="cap-note">最大 12 時間まで設定できます</div>
    </div>

    <!-- 時刻指定用：目標時刻の入力 -->
    <div id="target-setup" class="setup" style="display:none">
      <div class="custom-input">
        目標時刻
        <input id="in-target" type="time" step="60" />
        <button id="target-btn">セット</button>
      </div>
      <div class="cap-note">指定した時刻までカウントダウン（過ぎている場合は翌日）</div>
    </div>

    <!-- 操作ボタン -->
    <div class="controls">
      <button id="start-btn" class="primary">スタート</button>
      <button id="pause-btn" class="secondary" disabled>一時停止</button>
      <button id="reset-btn" class="secondary">リセット</button>
    </div>

    <!-- 毎正時チャイム -->
    <label class="chime-toggle">
      <input id="chime-on" type="checkbox" />
      <span>🔔 毎正時（XX:00）にチャイム</span>
    </label>
  </section>

  <!-- To-Do画面 -->
  <section id="tab-todo" class="tab-panel">
    <div class="todo-input">
      <input id="todo-text" type="text" placeholder="タスクを入力…" maxlength="200" />
      <button id="todo-add">追加</button>
    </div>
    <ul id="todo-list" class="todo-list"></ul>
    <div id="todo-empty" class="todo-empty">タスクはまだありません</div>
  </section>

  <script src="renderer.js"></script>
</body>
</html>
