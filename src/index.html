<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time & To-Do</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="light">
  <!-- タブ切り替え（将来 To-Do もここに増やす） -->
  <nav class="tabs">
    <button class="tab active" data-tab="timer">⏱ タイマー</button>
    <button class="tab" data-tab="todo">✓ To-Do</button>
    <button class="tab" data-tab="reminder">⏰ 通知</button>
    <button class="tab" data-tab="memo">📝 メモ</button>
    <button id="gear-btn" class="icon-btn" title="設定・データ">⚙</button>
    <button id="theme-toggle" class="icon-btn" title="テーマ切替">☀️</button>
  </nav>

  <!-- タイマー画面 -->
  <section id="tab-timer" class="tab-panel active">
    <!-- モード切り替え -->
    <div class="mode-switch">
      <button class="mode active" data-mode="target">時刻まで</button>
      <button class="mode" data-mode="countdown">カウントダウン</button>
      <!-- ポモドーロは非表示（使わないため）。復活させたい場合は下行のコメントを外す -->
      <!-- <button class="mode" data-mode="pomodoro">ポモドーロ</button> -->
    </div>

    <!-- 残り時間の表示（4重の同心円リング） -->
    <div class="display">
      <svg class="ring" viewBox="0 0 200 200">
        <!-- 背景トラック -->
        <circle class="ring-track track-total" cx="100" cy="100" r="92" />
        <circle class="ring-track track-hour" cx="100" cy="100" r="78" />
        <circle class="ring-track track-min" cx="100" cy="100" r="64" />
        <circle class="ring-track track-sec" cx="100" cy="100" r="50" />
        <!-- 進捗リング（外→内: 総/時/分/秒） -->
        <circle id="ring-total" class="ring-progress p-total" cx="100" cy="100" r="92" />
        <circle id="ring-hour"  class="ring-progress p-hour"  cx="100" cy="100" r="78" />
        <circle id="ring-min"   class="ring-progress p-min"   cx="100" cy="100" r="64" />
        <circle id="ring-sec"   class="ring-progress p-sec"   cx="100" cy="100" r="50" />
        <!-- 目盛りの区切り（背景色で切って、単位ごとのセグメントに見せる） -->
        <circle id="notch-total" class="ring-notch n-total" cx="100" cy="100" r="92" />
        <circle id="notch-hour"  class="ring-notch n-hour"  cx="100" cy="100" r="78" />
        <circle id="notch-min"   class="ring-notch n-min"   cx="100" cy="100" r="64" />
        <circle id="notch-sec"   class="ring-notch n-sec"   cx="100" cy="100" r="50" />
      </svg>
      <div class="ring-center">
        <div id="phase-label" class="phase-label"></div>
        <div id="pause-mark" class="pause-mark" hidden>⏸</div>
        <div id="time" class="time">00:00</div>
        <div id="now-clock" class="now-clock"></div>
        <div id="pomo-count" class="pomo-count"></div>
      </div>
    </div>

    <!-- リングの凡例 -->
    <div class="ring-legend">
      <span class="lg lg-total">総</span>
      <span class="lg lg-hour">時</span>
      <span class="lg lg-min">分</span>
      <span class="lg lg-sec">秒</span>
    </div>

    <!-- カウントダウン用：時間のプリセット＆入力 -->
    <div id="countdown-setup" class="setup" style="display:none">
      <div class="presets">
        <button class="preset" data-sec="60">1分</button>
        <button class="preset" data-sec="300">5分</button>
        <button class="preset" data-sec="600">10分</button>
        <button class="preset" data-sec="1500">25分</button>
        <button class="preset" data-sec="3600">1時間</button>
        <button class="preset" data-sec="10800">3時間</button>
      </div>
      <div class="custom-input">
        <input id="in-hour" type="number" min="0" max="12" value="0" /> 時
        <input id="in-min" type="number" min="0" max="59" value="5" /> 分
        <input id="in-sec" type="number" min="0" max="59" value="0" /> 秒
      </div>
      <div class="cap-note">最大 12 時間まで設定できます</div>
    </div>

    <!-- 時刻指定用：目標時刻の入力 -->
    <div id="target-setup" class="setup">
      <div class="custom-input">
        目標時刻
        <input id="in-target" type="time" step="60" />
      </div>
      <div class="cap-note">指定した時刻までカウントダウン（過ぎている場合は翌日）</div>
    </div>

    <!-- 操作ボタン -->
    <div class="controls">
      <button id="start-btn" class="primary">スタート</button>
      <button id="pause-btn" class="secondary" disabled>一時停止</button>
      <button id="reset-btn" class="secondary">リセット</button>
    </div>

    <!-- 毎正時チャイム -->
    <label class="chime-toggle">
      <input id="chime-on" type="checkbox" />
      <span>🔔 毎正時（XX:00）にチャイム</span>
    </label>

    <!-- 次にアラームが鳴るTo-Do（時刻まで モードのみ表示） -->
    <div id="next-todo" class="next-todo" style="display:none"></div>
    <!-- 予定時刻を過ぎた未完了タスク（1件・時刻まで モードのみ表示） -->
    <div id="overdue-todo" class="next-todo overdue-todo" style="display:none"></div>
  </section>

  <!-- To-Do画面 -->
  <section id="tab-todo" class="tab-panel">
    <div class="todo-input">
      <input id="todo-text" type="text" placeholder="タスクを入力…" maxlength="200" />
      <button id="todo-add">追加</button>
    </div>
    <div class="todo-input2">
      <input id="todo-date" type="date" class="todo-date-add td-ph" data-ph="yyyy/mm/dd" title="日付（任意・空欄で今日）" />
      <input id="todo-time" type="time" step="60" class="todo-time-add td-ph" data-ph="HH:MM" title="時刻（任意・空欄でアラームなし）" />
      <span class="todo-when-hint">日時（任意）</span>
    </div>
    <div id="todo-actions" class="todo-actions">
      <button id="todo-clear-done">完了したタスクを削除</button>
    </div>
    <div id="todo-filter" class="tag-filter"></div>
    <ul id="todo-list" class="todo-list"></ul>
    <div id="todo-empty" class="todo-empty">タスクはまだありません</div>
  </section>

  <!-- メモ画面（一言を入力すると下のリストに残る） -->
  <section id="tab-memo" class="tab-panel">
    <div class="memo-input">
      <textarea id="memo-input" rows="1" placeholder="メモを入力…（#タグ で分類）" title="Shift+Enter で追加 / Enter で改行" maxlength="1000"></textarea>
      <button id="memo-add">追加</button>
    </div>
    <div id="memo-filter" class="memo-filter"></div>
    <ul id="memo-list" class="memo-list"></ul>
    <div id="memo-empty" class="memo-empty">メモはまだありません</div>
  </section>

  <!-- リマインダー画面（繰り返し通知） -->
  <section id="tab-reminder" class="tab-panel">
    <div class="rem-input">
      <input id="rem-title" type="text" placeholder="リマインダー名…（例: 薬を飲む）" maxlength="100" />
      <input id="rem-time" type="time" step="60" class="rem-time td-ph" data-ph="HH:MM" title="通知する時刻" />
    </div>
    <div class="rem-row">
      <label class="rem-repeat-label">繰り返し
        <select id="rem-repeat">
          <option value="once">一回だけ</option>
          <option value="daily">毎日</option>
          <option value="weekdays" selected>平日（月〜金・祝日除く）</option>
          <option value="weekend">週末（土日）</option>
          <option value="weekly">毎週（曜日を選ぶ）</option>
        </select>
      </label>
      <input id="rem-date" type="date" class="rem-date td-ph" data-ph="yyyy/mm/dd" title="日付（一回だけ・空欄で直近）" hidden />
    </div>
    <div id="rem-weekdays" class="rem-weekdays" hidden></div>
    <div class="rem-add-row">
      <button id="rem-add">追加</button>
    </div>
    <ul id="rem-list" class="rem-list"></ul>
    <div id="rem-empty" class="rem-empty">リマインダーはまだありません</div>
  </section>

  <!-- 設定・データ（歯車メニュー。CSVで書き出し/読み込み） -->
  <div id="settings-overlay" class="overlay" hidden>
    <div class="overlay-card">
      <div class="overlay-head">
        <span>設定・データ</span>
        <button id="settings-close" class="overlay-close" title="閉じる">✕</button>
      </div>
    <p class="data-desc">To-Do とメモを CSV で書き出し／読み込みできます。別の端末で読み込むと復元できます。</p>

    <div class="data-group">
      <div class="data-title">書き出し</div>
      <div class="data-row">
        <button id="csv-export">CSVを保存</button>
      </div>
    </div>

    <div class="data-group">
      <div class="data-title">読み込み（現在の内容を置き換えます）</div>
      <div class="data-row">
        <button id="csv-import-file">ファイルから読み込み</button>
        <input id="csv-file" type="file" accept=".csv,text/csv,text/plain" hidden />
      </div>
      <textarea id="csv-paste" class="csv-paste" placeholder="ここに CSV を貼り付けて読み込むこともできます"></textarea>
      <button id="csv-import-text">貼り付けたCSVを読み込み</button>
    </div>

    <div id="data-status" class="data-status"></div>
    </div>
  </div>

  <script src="holidays.js"></script>
  <script src="mobile.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
